<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#c26c1d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="OSHOWANI">
    <meta name="description" content="Seek wisdom from OSHOWANI — the digital discourse of Bhagwan Shree Rajneesh.">
    <title>OSHOWANI</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="splash.css"> 
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        /* Privacy Policy Modal */
        .privacy-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 300;
            background: rgba(0,0,0,0.30);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(0.16,1,0.3,1);
        }
        .privacy-modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .privacy-modal-content {
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            border-radius: 28px 28px 0 0;
            background: #fffcf4;
            border: 1px solid rgba(255,255,255,0.90);
            box-shadow: 0 -8px 40px rgba(0,0,0,0.14);
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .privacy-modal-overlay.active .privacy-modal-content {
            transform: translateY(0);
        }
        .privacy-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 24px 16px;
            border-bottom: 1px solid rgba(0,0,0,0.07);
            flex-shrink: 0;
        }
        .privacy-modal-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #1e1408;
            letter-spacing: -0.3px;
        }
        .privacy-modal-body {
            overflow-y: auto;
            padding: 20px 24px 40px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .privacy-modal-body::-webkit-scrollbar { display: none; }
        .privacy-modal-body h3 {
            font-size: 14px;
            font-weight: 700;
            color: #c26c1d;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin: 24px 0 8px;
            padding-left: 10px;
            border-left: 3px solid #c26c1d;
        }
        .privacy-modal-body h3:first-child { margin-top: 0; }
        .privacy-modal-body p {
            font-size: 14px;
            line-height: 1.70;
            color: #3a2e22;
            margin-bottom: 10px;
        }
        .privacy-modal-body ul { margin: 4px 0 10px 18px; }
        .privacy-modal-body ul li {
            font-size: 14px;
            line-height: 1.65;
            color: #3a2e22;
            margin-bottom: 6px;
        }
        .privacy-highlight {
            background: rgba(194,108,29,0.08);
            border: 1px solid rgba(194,108,29,0.20);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 16px;
            font-size: 14px;
            line-height: 1.65;
            color: #3a2e22;
        }
        .privacy-highlight strong { color: #c26c1d; }
        .privacy-modal-body a { color: #c26c1d; text-decoration: none; }
        .privacy-modal-body a:hover { text-decoration: underline; }
        .privacy-footer-note {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: #9a8870;
        }
        /* Privacy button in settings */
        .privacy-setting-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            background: rgba(194,108,29,0.06);
            border: 1px solid rgba(194,108,29,0.18);
            border-radius: 12px;
            padding: 14px 16px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            text-align: left;
        }
        .privacy-setting-btn:hover {
            background: rgba(194,108,29,0.12);
            border-color: rgba(194,108,29,0.35);
        }
        .privacy-setting-btn .privacy-btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(194,108,29,0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #c26c1d;
        }
        .privacy-setting-btn .privacy-btn-icon svg { width: 18px; height: 18px; }
        .privacy-setting-btn .privacy-btn-text strong {
            display: block;
            font-size: 15px;
            font-weight: 600;
            color: #1e1408;
            margin-bottom: 2px;
        }
        .privacy-setting-btn .privacy-btn-text span {
            font-size: 12px;
            color: #7a6a58;
        }
        .privacy-setting-btn .privacy-btn-arrow {
            margin-left: auto;
            color: #c26c1d;
            flex-shrink: 0;
        }
        .privacy-setting-btn .privacy-btn-arrow svg { width: 16px; height: 16px; }

        /* Dark mode overrides */
        body[data-theme="dark"] .privacy-modal-content {
            background: rgb(30,20,10);
            border-color: rgba(255,255,255,0.10);
        }
        body[data-theme="dark"] .privacy-modal-header {
            border-bottom-color: rgba(255,255,255,0.08);
        }
        body[data-theme="dark"] .privacy-modal-header h2 {
            color: rgba(255,245,225,0.92);
        }
        body[data-theme="dark"] .privacy-modal-body p,
        body[data-theme="dark"] .privacy-modal-body li {
            color: rgba(255,245,218,0.80);
        }
        body[data-theme="dark"] .privacy-modal-body h3 {
            color: rgba(255,185,90,0.95);
            border-left-color: rgba(255,185,90,0.80);
        }
        body[data-theme="dark"] .privacy-highlight {
            background: rgba(194,108,29,0.14);
            border-color: rgba(194,108,29,0.30);
        }
        body[data-theme="dark"] .privacy-highlight strong {
            color: rgba(255,185,90,0.95);
        }
        body[data-theme="dark"] .privacy-modal-body a {
            color: rgba(255,185,90,0.92);
        }
        body[data-theme="dark"] .privacy-footer-note {
            color: rgba(255,255,255,0.35);
        }
        body[data-theme="dark"] .privacy-setting-btn {
            background: rgba(194,108,29,0.10);
            border-color: rgba(194,108,29,0.25);
        }
        body[data-theme="dark"] .privacy-setting-btn:hover {
            background: rgba(194,108,29,0.18);
        }
        body[data-theme="dark"] .privacy-setting-btn .privacy-btn-text strong {
            color: rgba(255,245,225,0.92);
        }
        body[data-theme="dark"] .privacy-setting-btn .privacy-btn-text span {
            color: rgba(255,255,255,0.40);
        }
        body[data-theme="dark"] .privacy-setting-btn .privacy-btn-icon {
            background: rgba(194,108,29,0.20);
        }
    </style>
</head>
<body>
    <!-- ═══ SPLASH SCREEN ═══ -->
<div id="splash-screen" aria-label="Oshowani loading" role="status">
  <h1 class="splash-title">Oshowani</h1>
  <p class="splash-tagline">Guidance. Meditation. Enlightenment.</p>
  <canvas id="splash-canvas" aria-hidden="true"></canvas>
</div>

    <div class="history-overlay" id="history-overlay"></div>

    <div class="history-sidebar" id="history-sidebar">
        <div class="history-header">
            <h2>Discourses</h2>
            <button class="icon-btn" id="close-history-btn" title="Close">
                <i data-feather="x"></i>
            </button>
        </div>
        <button class="new-chat-btn" id="new-chat-btn">
            <i data-feather="plus"></i>
            New Discourse
        </button>
        <div class="history-list" id="history-list"></div>
    </div>

    <div class="app-container">

        <header class="app-header">
            <div class="header-left">
                <button class="icon-btn" id="history-btn" title="Chat History">
                    <i data-feather="clock"></i>
                </button>
                <div class="avatar-container">
                    <img src="assets/osho-avatar.png" alt="Oshowani" class="osho-avatar">
                    <span class="status-dot"></span>
                </div>
                <div class="header-info">
                    <h1>Oshowani</h1>
                    <span class="status-text">Online</span>
                </div>
            </div>
            <div class="header-right">
                <button class="icon-btn" id="settings-btn" title="Settings">
                    <i data-feather="settings"></i>
                </button>
            </div>
        </header>

        <main class="chat-container">
            <div id="tsparticles"></div>
            <div class="chat-scroll-area" id="chat-scroll-area"></div>
        </main>

        <footer class="app-footer">
            <div class="input-container">
                <textarea id="message-input" placeholder="Ask Oshowani..." rows="1"></textarea>
                <button class="icon-btn send-btn" id="send-btn" title="Send">
                    <i data-feather="arrow-up"></i>
                </button>
            </div>
        </footer>

        <!-- Settings Modal -->
        <div class="modal-overlay" id="settings-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Settings</h2>
                    <button class="icon-btn" id="close-settings-btn">
                        <i data-feather="x"></i>
                    </button>
                </div>

                <!-- Privacy Policy Button -->
                <div class="setting-group">
                    <button class="privacy-setting-btn" id="open-privacy-btn">
                        <div class="privacy-btn-icon">
                            <i data-feather="shield"></i>
                        </div>
                        <div class="privacy-btn-text">
                            <strong>Privacy Policy</strong>
                            <span>How we handle your data</span>
                        </div>
                        <div class="privacy-btn-arrow">
                            <i data-feather="chevron-right"></i>
                        </div>
                    </button>
                </div>

                <!-- Language Setting -->
                <div class="setting-group">
                    <label for="language-select">Language</label>
                    <p class="setting-desc">Choose the language for Oshowani's discourses.</p>
                    <div class="input-with-icon">
                        <i data-feather="globe"></i>
                        <select id="language-select" class="custom-select">
                            <option value="Auto">Auto (detect language)</option>
                            <option value="English">English</option>
                            <option value="Hindi">Hindi (हिन्दी)</option>
                            <option value="Hinglish">Hinglish (हिंग्लिश)</option>
                            <option value="Spanish">Spanish (Español)</option>
                            <option value="French">French (Français)</option>
                            <option value="German">German (Deutsch)</option>
                            <option value="Portuguese">Portuguese (Português)</option>
                            <option value="Italian">Italian (Italiano)</option>
                            <option value="Japanese">Japanese (日本語)</option>
                            <option value="Chinese">Chinese (中文)</option>
                        </select>
                    </div>
                </div>

                <button class="primary-btn" id="save-settings-btn">Save Settings</button>
            </div>
        </div>

        <!-- Install Banner -->
        <div class="install-banner" id="install-banner">
            <div class="install-info">
                <img src="icons/icon-192.png" alt="Oshowani" class="install-icon">
                <div>
                    <strong>Add to Home Screen</strong>
                    <span>Install for the best experience</span>
                </div>
            </div>
            <div style="display:flex;gap:8px">
                <button class="icon-btn" id="install-btn" title="Install">
                    <i data-feather="download"></i>
                </button>
                <button class="icon-btn" id="close-install-btn" title="Dismiss">
                    <i data-feather="x"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- Privacy Policy Modal — outside app-container, fixed positioned -->
    
    
    
    <!-- ✅ tsparticles CDN script REMOVED — dandelion canvas in app.js handles animation -->
    <script src="app.js"></script>

    <script>
        // Privacy Modal Logic
        const privacyModal = document.getElementById('privacy-modal');
        const openPrivacyBtn = document.getElementById('open-privacy-btn');
        const closePrivacyBtn = document.getElementById('close-privacy-btn');

        openPrivacyBtn.addEventListener('click', () => {
            privacyModal.classList.add('active');
            feather.replace();
        });

        closePrivacyBtn.addEventListener('click', () => {
            privacyModal.classList.remove('active');
        });

        privacyModal.addEventListener('click', (e) => {
            if (e.target === privacyModal) privacyModal.classList.remove('active');
        });
    </script>
<script src="splash.js"></script>
</body>
</html>
