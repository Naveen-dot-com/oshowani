<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1025">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="OSHOWANI">
    <meta name="description" content="Seek wisdom from OSHOWANI — the digital discourse of Bhagwan Shree Rajneesh.">
    <title>OSHOWANI</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>

    <div class="history-overlay" id="history-overlay"></div>

    <div class="history-sidebar" id="history-sidebar">
        <div class="history-header">
            <h2>Discourses</h2>
            <button class="icon-btn" id="close-history-btn" title="Close">
                <i data-feather="x"></i>
            </button>
        </div>
        <button class="new-chat-btn" id="new-chat-btn">
            <i data-feather="plus"></i>
            New Discourse
        </button>
        <div class="history-list" id="history-list"></div>
    </div>

    <div class="app-container">

        <header class="app-header">
            <div class="header-left">
                <button class="icon-btn" id="history-btn" title="Chat History">
                    <i data-feather="clock"></i>
                </button>
                <div class="avatar-container">
                    <img src="assets/osho-avatar.png" alt="Oshowani" class="osho-avatar">
                    <span class="status-dot"></span>
                </div>
                <div class="header-info">
                    <h1>Oshowani</h1>
                    <span class="status-text">Online</span>
                </div>
            </div>
            <div class="header-right">
                <button class="icon-btn" id="settings-btn" title="Settings">
                    <i data-feather="settings"></i>
                </button>
            </div>
        </header>

        <main class="chat-container">
            <div id="tsparticles"></div>
            <div class="chat-scroll-area" id="chat-scroll-area"></div>
        </main>

        <footer class="app-footer">
            <div class="input-container">
                <textarea id="message-input" placeholder="Ask Oshowani..." rows="1"></textarea>
                <button class="icon-btn send-btn" id="send-btn" title="Send">
                    <i data-feather="arrow-up"></i>
                </button>
            </div>
        </footer>

        <div class="modal-overlay" id="settings-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Settings</h2>
                    <button class="icon-btn" id="close-settings-btn">
                        <i data-feather="x"></i>
                    </button>
                </div>
                <div class="setting-group">
                    <label for="language-select">Language</label>
                    <p class="setting-desc">Choose the language for Oshowani's discourses.</p>
                    <div class="input-with-icon">
                        <i data-feather="globe"></i>
                        <select id="language-select" class="custom-select">
    <option value="Auto">Auto (detect language)</option>
    <option value="English">English</option>
    <option value="Hindi">Hindi (हिन्दी)</option>
    <option value="Hinglish">Hinglish (हिंग्लिश)</option>
    <option value="Spanish">Spanish (Español)</option>
    <option value="French">French (Français)</option>
    <option value="German">German (Deutsch)</option>
    <option value="Portuguese">Portuguese (Português)</option>
    <option value="Italian">Italian (Italiano)</option>
    <option value="Japanese">Japanese (日本語)</option>
    <option value="Chinese">Chinese (中文)</option>
</select>


                    </div>
                </div>
                <button class="primary-btn" id="save-settings-btn">Save Settings</button>
            </div>
        </div>

        <div class="install-banner" id="install-banner">
            <div class="install-info">
                <img src="icons/icon-192.png" alt="Oshowani" class="install-icon">
                <div>
                    <strong>Add to Home Screen</strong>
                    <span>Install for the best experience</span>
                </div>
            </div>
            <div style="display:flex;gap:8px">
                <button class="icon-btn" id="install-btn" title="Install">
                    <i data-feather="download"></i>
                </button>
                <button class="icon-btn" id="close-install-btn" title="Dismiss">
                    <i data-feather="x"></i>
                </button>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
