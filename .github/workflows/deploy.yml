name: Deploy to GitHub Pages

on:
  push:
    branches:
      - QA

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject API Key into app.js
        run: |
          sed -i "s|YOUR_GEMINI_API_KEY_HERE|${{ secrets.GEMINI_API_KEY }}|g" app.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
